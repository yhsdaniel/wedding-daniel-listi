name: Supabase Keep Alive

# Runs every 3 days — well inside Supabase's 7-day inactivity window,
# so you have margin even if a run gets delayed.
on:
  schedule:
    - cron: "0 9 */3 * *"   # 09:00 UTC, every 3 days
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response code: $response"

          if [ "$response" -ne 200 ]; then
            echo "::error::Supabase ping failed with status $response"
            exit 1
          fi

          echo "✅ Supabase project pinged successfully — pause timer reset."
